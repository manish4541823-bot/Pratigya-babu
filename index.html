<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="A tiny little page made with love.">
  <title>Little Love 💗</title>
  <link rel="icon" href="assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main class="card">
    <div class="top-heart" aria-hidden="true">♡</div>
    <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>
    <h1>Hey, <span id="name">Beautiful</span> <span class="pink">♡</span></h1>
    <p class="intro">Some people make ordinary days feel a little more magical.</p>

    <div class="heart-scene" aria-label="A pink heart">
      <div class="heart">♥</div>
      <span class="spark spark-a">✦</span>
      <span class="spark spark-b">✧</span>
      <span class="spark spark-c">✦</span>
    </div>

    <p class="message" id="message">Just a small reminder that you make the world brighter.</p>
    <button id="loveButton" type="button">Tap for a little love <span>♡</span></button>
    <p class="tiny-note" id="note" aria-live="polite">Made with a little HTML, CSS & lots of heart.</p>
  </main>

  <footer>made with <span aria-label="love">♥</span> for someone special</footer>
  <script src="script.js"></script>
</body>
</html>
